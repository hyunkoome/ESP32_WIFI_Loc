# 저장소 Python 도구 설정.
# 현재는 ruff(lint/format) 설정만 둔다. 패키지 빌드 용도는 아니다.

[tool.ruff]
target-version = "py310"
line-length = 100

# lint 대상에서 제외할 경로:
#  - reference/ : esp-csi 등 외부 원본(우리 스타일 책임 아님)
#  - venv/, build/, managed_components/ : 가상환경·빌드 산출물
#  - *_ref.py : 참고용으로 복사해 둔 원본 스크립트
extend-exclude = [
    "reference",
    "venv",
    "hw",
    "**/build",
    "**/managed_components",
    "**/*_ref.py",
]

[tool.ruff.lint]
# E(pycodestyle), F(pyflakes), I(isort) 로 보수적으로 시작.
# UP(pyupgrade)는 기존 board_check 코드와 광범위하게 충돌하므로 지금은 제외한다.
# (Dict→dict 등 대규모 자동변환은 별도 정리 작업에서 다룬다.)
select = ["E", "F", "I"]
# 아래 규칙들은 이 코드베이스의 의도적 compact 스타일이라 완화한다(E501 과 같은 취지):
#  - E501 : 한국어 주석이 많아 라인이 길어짐
#  - E702 : 짝 변수 묶기 등 `a = ...; b = ...` 한 줄 표기를 의도적으로 씀
#  - E731 : `mean = lambda xs: ...` 같은 짧은 헬퍼를 람다로 둠
#  - E741 : 짧은 콜백 인자 `l`(line/label) 등 모호명 허용
ignore = ["E501", "E702", "E731", "E741"]
