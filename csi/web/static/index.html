<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 CSI 모니터</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>ESP32 CSI 모니터</h1>
    <p class="sub">esp32_device.yaml 의 tx/rx 보드 상태와 CSI 실시간 수신을 모니터링합니다.</p>
  </header>

  <section>
    <h2>디바이스 상태 <button id="refresh" class="btn-mini">새로고침</button></h2>
    <div id="devices" class="device-grid"></div>
  </section>

  <section>
    <h2>CSI 라이브</h2>
    <div class="live-bar">
      <span id="live-target">선택된 rx 없음</span>
      <span class="metric">rate: <b id="m-rate">0</b> pkt/s</span>
      <span class="metric">RSSI: <b id="m-rssi">-</b> dBm</span>
      <span class="metric">subcarriers: <b id="m-sub">-</b></span>
      <button id="stop" class="btn-mini" disabled>정지</button>
    </div>
    <canvas id="chart" width="900" height="280"></canvas>
    <p class="hint">막대는 서브캐리어별 진폭(|H|)입니다. rx 카드의 “모니터 시작”을 누르세요.</p>
  </section>

  <footer>
    <span id="ws-state" class="ws-off">WebSocket: 미연결</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
