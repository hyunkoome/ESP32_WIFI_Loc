# 모션 인지(정적/동적 분류) 설정 — CSI GUI 가 런타임에 로드한다.
# 하이퍼파라미터는 사람이 조정, classifiers 는 GUI 의 'Train Classifier' 가 자동 갱신한다.
motion_detection:
  # --- 공통 하이퍼파라미터 ---
  move_window: 20     # 변동지표 계산 윈도우(최근 N 프레임, ~2초 @10Hz)
  ema_alpha: 0.3      # 변동지표 EMA 계수(0~1). 작을수록 부드럽고 느림, 클수록 민감/빠름
  outlier_n: 5        # 연속 N회 같은 결과여야 상태 확정(순간 튐 완화)
  hysteresis: 0.15    # 히스테리시스 마진 = 임계 × 이 비율. 경계 진동 방지

  # --- 3상태 판정 디폴트 임계 (실측 검증 기반, rx 별 Train 전까지 사용) ---
  # presence = std(진폭의 시간 표준편차), motion = doppler(도플러 피크).
  # 판정: doppler > doppler_th → Motion / elif std > std_th → Presence / else Empty.
  default_std_th: 0.90       # presence 임계 — std 가 이보다 크면 사람 있음
  default_doppler_th: 75.0   # motion 임계 — doppler 가 이보다 크면 움직임

  # --- rx 별 학습 결과 (Train 시 자동 갱신, serial 키) ---
  # 각 항목: std_th, doppler_th(판정 임계) + empty/presence/motion 통계(std/doppler 평균·최대).
  classifiers: {}
